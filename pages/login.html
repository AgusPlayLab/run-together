<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ef">
  <title>RunTogether — Entrar</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="../index.html"><span class="brand-mark">↗</span><span>run<span class="brand-light">together</span></span></a>
      <span class="private-pill"><span class="dot"></span> Solo para dos</span>
    </header>

    <section class="login-wrap">
      <div class="eyebrow">UN PLAN, DOS PARES DE ZAPATILLAS</div>
      <h1>¿Corres<br><em>conmigo?</em></h1>
      <p class="intro">Un pequeño espacio para encontrar el momento y compartir kilómetros.</p>

      <form id="password-form" class="login-card">
        <label for="email">Tu correo electrónico</label>
        <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="button primary full" type="submit">Entrar <span>↗</span></button>
        <button id="magic-link-button" class="link-button" type="button">Prefiero que me envíes un enlace mágico ✨</button>
        <p class="hint" id="login-message">Solo pueden entrar las dos personas invitadas.</p>
      </form>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite" class="toast"></div>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
